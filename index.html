<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Budget Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #f8f9fa;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .stat {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .income { color: #28a745; }
        .expense { color: #dc3545; }
        .balance { color: #17a2b8; }

        .main-content {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4facfe;
        }

        .btn {
            background: #4facfe;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }

        .btn:hover {
            background: #369be6;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .transaction-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .transaction-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #4facfe;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .transaction-item.expense {
            border-left-color: #dc3545;
        }

        .transaction-amount {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .transaction-details {
            flex-grow: 1;
        }

        .transaction-meta {
            color: #666;
            font-size: 0.9rem;
        }

        .budget-section {
            grid-column: span 2;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .budget-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .budget-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .budget-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #28a745;
            transition: width 0.3s ease;
        }

        .progress-fill.over-budget {
            background: #dc3545;
        }

        .empty-state {
            text-align: center;
            color: #666;
            padding: 30px;
            font-style: italic;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .budget-section {
                grid-column: span 1;
            }
            
            .budget-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Personal Budget Tracker</h1>
            <p>Track your income, expenses, and budgets</p>
        </div>

        <div class="dashboard">
            <div class="card">
                <h3>Total Income</h3>
                <div class="stat income" id="totalIncome">$0.00</div>
            </div>
            <div class="card">
                <h3>Total Expenses</h3>
                <div class="stat expense" id="totalExpenses">$0.00</div>
            </div>
            <div class="card">
                <h3>Balance</h3>
                <div class="stat balance" id="balance">$0.00</div>
            </div>
            <div class="card">
                <h3>Transactions</h3>
                <div class="stat" id="transactionCount">0</div>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="main-content">
            <div class="section">
                <h3>Add New Transaction</h3>
                <form id="transactionForm">
                    <div class="form-group">
                        <label>Amount ($)</label>
                        <input type="number" id="amount" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="type" required>
                            <option value="">Select type</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" required>
                            <option value="">Select category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Salary">Salary</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label>Notes</label>
                        <input type="text" id="notes" placeholder="Optional description">
                    </div>
                    <button type="submit" class="btn">Add Transaction</button>
                </form>
            </div>

            <div class="section">
                <h3>Transaction History</h3>
                <div class="filters">
                    <select id="filterType">
                        <option value="all">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                    <select id="filterCategory">
                        <option value="all">All Categories</option>
                    </select>
                </div>
                <div id="transactionList" class="transaction-list">
                    <div class="empty-state">No transactions yet</div>
                </div>
            </div>

            <div class="budget-section">
                <h3>Budget Management</h3>
                <div class="budget-form">
                    <select id="budgetCategory">
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="number" id="budgetAmount" placeholder="Monthly budget ($)" step="0.01" min="0">
                    <button type="button" class="btn" onclick="setBudget()">Set Budget</button>
                </div>
                <div id="budgetList">
                    <div class="empty-state">No budgets set</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log('Script starting...');

        // Global variables
        let transactions = [];
        let budgets = {};

        // Initialize the app
        function initApp() {
            console.log('Initializing app...');
            
            // Load data from localStorage
            try {
                const savedTransactions = localStorage.getItem('budgetTracker_transactions');
                const savedBudgets = localStorage.getItem('budgetTracker_budgets');
                
                if (savedTransactions) {
                    transactions = JSON.parse(savedTransactions);
                    console.log('Loaded transactions:', transactions.length);
                }
                
                if (savedBudgets) {
                    budgets = JSON.parse(savedBudgets);
                    console.log('Loaded budgets:', Object.keys(budgets).length);
                }
            } catch (error) {
                console.error('Error loading data:', error);
                transactions = [];
                budgets = {};
            }

            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;

            // Add sample data if empty
            if (transactions.length === 0) {
                addSampleData();
            }

            // Update displays
            updateDashboard();
            displayTransactions();
            displayBudgets();
            updateFilters();

            console.log('App initialized successfully');
        }

        // Add sample data for demo
        function addSampleData() {
            console.log('Adding sample data...');
            const sampleTransactions = [
                {
                    id: 1,
                    amount: 3000,
                    type: 'income',
                    category: 'Salary',
                    date: '2024-09-01',
                    notes: 'Monthly salary'
                },
                {
                    id: 2,
                    amount: 25.50,
                    type: 'expense',
                    category: 'Food',
                    date: '2024-09-15',
                    notes: 'Lunch'
                },
                {
                    id: 3,
                    amount: 45,
                    type: 'expense',
                    category: 'Transport',
                    date: '2024-09-16',
                    notes: 'Gas'
                }
            ];

            transactions = sampleTransactions;
            budgets = {
                'Food': 300,
                'Transport': 150,
                'Entertainment': 200
            };

            saveData();
        }

        // Save data to localStorage
        function saveData() {
            try {
                localStorage.setItem('budgetTracker_transactions', JSON.stringify(transactions));
                localStorage.setItem('budgetTracker_budgets', JSON.stringify(budgets));
                console.log('Data saved successfully');
            } catch (error) {
                console.error('Error saving data:', error);
                showAlert('Error saving data', 'danger');
            }
        }

        // Show alert messages
        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }

        // Add new transaction
        function addTransaction(event) {
            event.preventDefault();
            console.log('Adding transaction...');

            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;
            const date = document.getElementById('date').value;
            const notes = document.getElementById('notes').value;

            if (!amount || !type || !category || !date) {
                showAlert('Please fill in all required fields', 'danger');
                return;
            }

            const transaction = {
                id: Date.now(),
                amount: amount,
                type: type,
                category: category,
                date: date,
                notes: notes
            };

            transactions.unshift(transaction);
            saveData();
            
            // Reset form
            document.getElementById('transactionForm').reset();
            document.getElementById('date').value = new Date().toISOString().split('T')[0];

            // Update displays
            updateDashboard();
            displayTransactions();
            updateFilters();

            showAlert(`${type === 'income' ? 'Income' : 'Expense'} of $${amount.toFixed(2)} added successfully!`);
            console.log('Transaction added:', transaction);
        }

        // Delete transaction
        function deleteTransaction(id) {
            if (confirm('Are you sure you want to delete this transaction?')) {
                console.log('Deleting transaction:', id);
                transactions = transactions.filter(t => t.id !== id);
                saveData();
                updateDashboard();
                displayTransactions();
                updateFilters();
                showAlert('Transaction deleted');
            }
        }

        // Update dashboard statistics
        function updateDashboard() {
            console.log('Updating dashboard...');
            
            const income = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
            const expenses = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
            const balance = income - expenses;

            document.getElementById('totalIncome').textContent = '$' + income.toFixed(2);
            document.getElementById('totalExpenses').textContent = '$' + expenses.toFixed(2);
            document.getElementById('balance').textContent = '$' + balance.toFixed(2);
            document.getElementById('transactionCount').textContent = transactions.length.toString();

            // Update balance color
            const balanceEl = document.getElementById('balance');
            balanceEl.className = `stat ${balance >= 0 ? 'income' : 'expense'}`;
        }

        // Display transactions
        function displayTransactions() {
            console.log('Displaying transactions...');
            
            const filterType = document.getElementById('filterType').value;
            const filterCategory = document.getElementById('filterCategory').value;
            
            let filteredTransactions = transactions.filter(t => {
                const typeMatch = filterType === 'all' || t.type === filterType;
                const categoryMatch = filterCategory === 'all' || t.category === filterCategory;
                return typeMatch && categoryMatch;
            });

            const listContainer = document.getElementById('transactionList');
            
            if (filteredTransactions.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">No transactions found</div>';
                return;
            }

            const html = filteredTransactions.map(t => `
                <div class="transaction-item ${t.type}">
                    <div class="transaction-details">
                        <div class="transaction-amount ${t.type}">
                            ${t.type === 'income' ? '+' : '-'}$${t.amount.toFixed(2)}
                        </div>
                        <div class="transaction-meta">
                            ${t.category} • ${new Date(t.date).toLocaleDateString()}
                            ${t.notes ? ' • ' + t.notes : ''}
                        </div>
                    </div>
                    <button class="btn btn-danger" onclick="deleteTransaction(${t.id})">Delete</button>
                </div>
            `).join('');

            listContainer.innerHTML = html;
        }

        // Set budget
        function setBudget() {
            const category = document.getElementById('budgetCategory').value;
            const amount = parseFloat(document.getElementById('budgetAmount').value);

            if (!category || !amount || amount <= 0) {
                showAlert('Please select a category and enter a valid amount', 'danger');
                return;
            }

            budgets[category] = amount;
            saveData();
            
            // Clear form
            document.getElementById('budgetCategory').value = '';
            document.getElementById('budgetAmount').value = '';

            displayBudgets();
            showAlert(`Budget set for ${category}: $${amount.toFixed(2)}`);
            console.log('Budget set:', category, amount);
        }

        // Display budgets
        function displayBudgets() {
            console.log('Displaying budgets...');
            
            const budgetList = document.getElementById('budgetList');
            const budgetEntries = Object.entries(budgets);

            if (budgetEntries.length === 0) {
                budgetList.innerHTML = '<div class="empty-state">No budgets set</div>';
                return;
            }

            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();

            const html = budgetEntries.map(([category, budget]) => {
                const spent = transactions
                    .filter(t => {
                        const tDate = new Date(t.date);
                        return t.type === 'expense' && 
                               t.category === category &&
                               tDate.getMonth() === currentMonth &&
                               tDate.getFullYear() === currentYear;
                    })
                    .reduce((sum, t) => sum + t.amount, 0);

                const percentage = (spent / budget) * 100;
                const isOverBudget = spent > budget;
                const remaining = budget - spent;

                return `
                    <div class="budget-item">
                        <div class="budget-header">
                            <strong>${category}</strong>
                            <span>$${spent.toFixed(2)} / $${budget.toFixed(2)}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill ${isOverBudget ? 'over-budget' : ''}" 
                                 style="width: ${Math.min(percentage, 100)}%"></div>
                        </div>
                        <div style="margin-top: 8px; font-size: 0.9em; color: ${isOverBudget ? '#dc3545' : '#28a745'}">
                            ${isOverBudget ? 
                                `Over budget by $${(spent - budget).toFixed(2)}` : 
                                `Remaining: $${remaining.toFixed(2)}`
                            }
                        </div>
                        <button class="btn btn-danger" onclick="deleteBudget('${category}')" style="margin-top: 10px;">
                            Remove Budget
                        </button>
                    </div>
                `;
            }).join('');

            budgetList.innerHTML = html;
        }

        // Delete budget
        function deleteBudget(category) {
            if (confirm(`Remove budget for ${category}?`)) {
                delete budgets[category];
                saveData();
                displayBudgets();
                showAlert(`Budget for ${category} removed`);
            }
        }

        // Update filter dropdowns
        function updateFilters() {
            const categoryFilter = document.getElementById('filterCategory');
            const categories = [...new Set(transactions.map(t => t.category))];
            
            categoryFilter.innerHTML = '<option value="all">All Categories</option>' +
                categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing...');
            initApp();

            // Form submission
            document.getElementById('transactionForm').addEventListener('submit', addTransaction);

            // Filter changes
            document.getElementById('filterType').addEventListener('change', displayTransactions);
            document.getElementById('filterCategory').addEventListener('change', displayTransactions);
        });

        console.log('Script loaded successfully');
    </script>
</body>
</html>
